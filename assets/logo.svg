<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd27a"/>
      <stop offset="100%" stop-color="#f0a83c"/>
    </linearGradient>
    <linearGradient id="omGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd27a"/>
      <stop offset="55%" stop-color="#f0a83c"/>
      <stop offset="100%" stop-color="#ff2ea6"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <circle cx="100" cy="100" r="94" fill="#0b0508" stroke="url(#ringGrad)" stroke-width="6"/>

  <text x="100" y="146" text-anchor="middle"
        font-family="'Noto Sans Devanagari','Noto Serif Devanagari',sans-serif"
        font-size="130" fill="url(#omGrad)" filter="url(#glow)">ॐ</text>
</svg>
