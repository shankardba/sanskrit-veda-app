<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vedavani — Sanskrit Chant Learner</title>
<meta name="description" content="Vedavani — learn Sanskrit chants line by line, Devanagari alongside IAST transliteration.">
<link rel="icon" href="assets/logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@400;500;600&family=Noto+Sans+Devanagari:wght@400;500;600&family=Gentium+Plus:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<header class="site-header">
  <nav class="navbar">
    <a href="#top" class="logo-group">
      <img src="assets/logo.svg" alt="Vedavani" class="logo-mark">
      <span class="logo-word glow-gold">Vedavani</span>
    </a>
    <select class="chant-select" id="chantSelect" aria-label="Choose a chant"></select>
  </nav>
</header>

<div class="control-bar">
  <button type="button" class="translit-bubble active" id="transliterationToggle" aria-pressed="true">Transliteration</button>
</div>

<main id="top">
  <div class="chant-header container">
    <h1 class="chant-title-deva" id="chantTitleDeva">&nbsp;</h1>
    <p class="chant-title-iast" id="chantTitleIast"></p>
    <p class="chant-source" id="chantSource"></p>
  </div>

  <div class="chant-body container" id="chantBody">
    <p class="loading">Loading chant…</p>
  </div>
</main>

<script src="js/app.js"></script>
</body>
</html>
